# =============================================================================
# ArgoCD Application - production.
#
# Differs from dev in three deliberate ways:
#
#   1. targetRevision is a tag pattern, not a branch. Production deploys a
#      released artifact, so a merge to main cannot change production by itself.
#   2. selfHeal is OFF. During an incident an operator must be able to scale or
#      patch a workload without ArgoCD reverting it mid-mitigation. Drift is
#      reported and reconciled deliberately.
#   3. Sync is still automated but pruning is guarded, so a bad commit that
#      removes a template cannot silently delete production workloads.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-interview-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: prod
    app.kubernetes.io/part-of: ai-interview-platform
  annotations:
    # Send sync failures and health degradation somewhere a human will see them.
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: platform-alerts
spec:
  project: ai-interview-platform

  source:
    repoURL: https://github.com/your-org/ai-interview-platform.git
    # Tracks the latest semver tag. The CD workflow creates the tag; nothing
    # else moves production.
    targetRevision: "v*"
    path: helm/ai-interview-platform
    helm:
      releaseName: ai-interview
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # Account-specific values live here rather than in the committed values
      # file, so the same chart serves every AWS account. Replace the
      # placeholders with your Terraform outputs.
      parameters:
        - name: global.imageRegistry
          value: "123456789012.dkr.ecr.ap-south-1.amazonaws.com"
        - name: middleware.serviceAccount.roleArn
          value: "arn:aws:iam::123456789012:role/ai-interview-prod-middleware"
        - name: aiService.serviceAccount.roleArn
          value: "arn:aws:iam::123456789012:role/ai-interview-prod-ai-service"
        - name: middleware.storage.s3.bucket
          value: "ai-interview-prod-resumes"
        - name: ingress.host
          value: "ai-interview.example.com"
        - name: ingress.certificateArn
          value: "arn:aws:acm:ap-south-1:123456789012:certificate/REPLACE-ME"

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-interview-prod

  syncPolicy:
    automated:
      prune: true
      # Off on purpose. See the header: an operator must be able to intervene
      # during an incident without ArgoCD undoing the mitigation.
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true
      # Requires a human to confirm any deletion that ArgoCD considers risky.
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  revisionHistoryLimit: 20
