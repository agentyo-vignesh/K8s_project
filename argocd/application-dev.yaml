# =============================================================================
# ArgoCD Application - development.
#
#   kubectl apply -f argocd/project.yaml
#   kubectl apply -f argocd/application-dev.yaml
#
# Dev runs fully automated: sync, prune and self-heal are all on, so the cluster
# always matches Git and manual kubectl edits are reverted within minutes. That
# is deliberate — the cluster should be reproducible from the repository alone.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-interview-dev
  namespace: argocd
  finalizers:
    # Cascades deletion to the Application's resources. Without it, deleting the
    # Application leaves the workloads running in the cluster.
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    app.kubernetes.io/part-of: ai-interview-platform
spec:
  project: ai-interview-platform

  source:
    repoURL: https://github.com/your-org/ai-interview-platform.git
    targetRevision: develop
    path: helm/ai-interview-platform
    helm:
      releaseName: ai-interview
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-interview-dev

  syncPolicy:
    automated:
      # Deletes resources removed from Git. Without prune, a template deleted in
      # a commit keeps running in the cluster forever.
      prune: true
      # Reverts manual changes. This is what makes Git the source of truth
      # rather than a suggestion.
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      # Applies to the last-applied-configuration annotation rather than
      # replacing objects, which avoids recreating Services and losing ClusterIPs.
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      # Keeps the ServerSideApply field manager consistent so a large CRD does
      # not hit the client-side annotation size limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  # Replicas are owned by the HPA at runtime, not by Git. Without this, ArgoCD
  # reports OutOfSync on every scale event and self-heal fights the autoscaler.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  revisionHistoryLimit: 10
