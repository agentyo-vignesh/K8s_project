# =============================================================================
# Dependabot: security fixes only.
#
# The full version-update config opened 21 pull requests on the first scan -
# six of them major bumps (JDK 21 to 24, Node 22 to 26, Python 3.12 to 3.14).
# That is noise on a teaching repository, and reviewing it competes with the
# work the repository exists to teach.
#
# Security advisories are NOT affected by this file. GitHub raises those
# regardless, and those are the ones worth acting on.
#
# To turn routine updates back on, change interval from "monthly" to "weekly"
# and remove the ignore blocks.
# =============================================================================
version: 2

updates:
  # GitHub Actions are pinned by tag, and a stale tag breaks CI loudly rather
  # than silently, so monthly is enough.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # A major bump of an action usually changes its inputs
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: maven
    directory: /middleware
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Base images are pinned on purpose. A bump here changes the JDK, Node or
  # Python the app runs on, so it is a deliberate decision, not a chore.
  # What actually forces a base image forward is the Trivy image scan in each
  # deploy workflow, which fails on a fixable CRITICAL. The filesystem scan in
  # security.yml is exit-code 0 and only reports.
  - package-ecosystem: docker
    directories:
      - /middleware
      - /backend
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
