# Build the AI service image, push it to ECR, deploy it with Helm.
# Same shape as deploy-middleware.yml, with a shorter timeout.
name: Deploy ai-service

on:
  # Only after CI ai-service passes. No paths filter is needed here - CI ai-service
  # has one, so a change that misses it never starts CI and never reaches
  # this workflow either.
  workflow_run:
    workflows: ["CI ai-service"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  CLUSTER: ai-interview
  NAMESPACE: ai-interview

  # The commit CI actually tested. On a workflow_run event github.sha is the
  # tip of the default branch, NOT the commit that triggered the run - using
  # it would build one commit and tag it as another. Falls back to github.sha
  # for a manual dispatch, where workflow_run is empty.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # workflow_run fires when CI finishes, pass OR fail. Without this a red
    # CI would still deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as SHA: the default checkout takes the branch tip,
          # which may already be a newer commit than the one CI passed.
          ref: ${{ env.SHA }}

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ./backend is the folder; ai-service is the name everywhere else
      - name: Build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t scan-target ./backend

      # Scan before the image leaves the runner. A vulnerable image never
      # reaches ECR, so nothing can pull it by mistake later. Only fixable
      # CRITICALs fail: an unpatched CVE in a base image cannot be actioned here
      # and blocking on it would teach people to ignore the gate.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: scan-target
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/ai-interview-platform/ai-service:$SHA"
          docker tag scan-target "$IMAGE"
          docker push "$IMAGE"

      - name: Read account id
        id: aws
        run: echo "account=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Get cluster credentials
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"

      - name: Deploy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          helm upgrade --install ai-service ./helm/ai-service \
            --namespace "$NAMESPACE" \
            --set imageRegistry="$REGISTRY" \
            --set imageTag="$SHA" \
            --set aws.roleArn="arn:aws:iam::${{ steps.aws.outputs.account }}:role/ai-interview-ai-service" \
            --wait --timeout 5m

      - name: Show what is running
        run: kubectl get pods -n "$NAMESPACE" -l app=ai-service
