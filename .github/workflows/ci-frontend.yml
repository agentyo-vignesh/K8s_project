# Tests the frontend. Does not deploy, does not touch AWS.
name: CI frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "helm/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "helm/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

# A newer push to the same branch cancels this run
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: React app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, not npm install: fails if package.json and the lockfile disagree
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # lint renders with the values given here. Without them it uses the
      # chart defaults, where imageTag is deliberately empty, and fails on
      # the malformed image reference rather than on anything real.
      - name: Lint
        run: helm lint ./helm/frontend --set imageRegistry=000000000000.dkr.ecr.ap-south-1.amazonaws.com --set imageTag=ci

      # Placeholder registry - nothing here talks to AWS
      - name: Render
        run: |
          helm template ci ./helm/frontend \
            --set imageRegistry=000000000000.dkr.ecr.ap-south-1.amazonaws.com \
            --set imageTag=ci \
            > rendered.yaml

      # Writes into the workspace, not /tmp: a docker:// action only
      # mounts the workspace, so a file in /tmp is invisible to it.
      - name: Validate against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -ignore-missing-schemas -summary rendered.yaml

  secrets:
    name: GitLeaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still in the
          # history and still compromised, so a shallow clone would miss it.
          fetch-depth: 0

      # Here rather than in security.yml, because a leaked secret must stop the
      # deploy. security.yml runs on pull requests and nightly, neither of which
      # gates a push straight to main.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
