# Tests the frontend. Does not deploy, does not touch AWS.
name: CI frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "helm/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "helm/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

# A newer push to the same branch cancels this run
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: React app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, not npm install: fails if package.json and the lockfile disagree
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint
        run: helm lint ./helm/frontend

      # Placeholder registry - nothing here talks to AWS
      - name: Render
        run: |
          helm template ci ./helm/frontend \
            --set imageRegistry=000000000000.dkr.ecr.ap-south-1.amazonaws.com \
            > /tmp/frontend.yaml

      - name: Validate against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -ignore-missing-schemas -summary /tmp/frontend.yaml
