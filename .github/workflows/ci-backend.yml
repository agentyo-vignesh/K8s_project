# Tests middleware and ai-service. Does not deploy, does not touch AWS.
name: CI backend

on:
  push:
    branches: [main, develop]
    paths:
      - "middleware/**"
      - "backend/**"
      - "helm/middleware/**"
      - "helm/ai-service/**"
      - "helm/platform/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "middleware/**"
      - "backend/**"
      - "helm/middleware/**"
      - "helm/ai-service/**"
      - "helm/platform/**"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  middleware:
    name: Middleware (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No database service. All 70 tests are plain JUnit and Mockito, so Spring
    # never starts and nothing connects to a database.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: middleware
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: middleware/target/surefire-reports/TEST-*.xml
          check_name: Middleware test results
          fail_on_failure: false

  ai-service:
    name: AI service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Type check
        working-directory: backend
        run: mypy app

      # Runs on in-memory SQLite, so no database service is needed
      - name: Test
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

  charts:
    name: Helm charts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint
        run: |
          for c in platform middleware ai-service; do
            echo "--- $c"
            helm lint ./helm/$c
          done

      # Placeholder values - nothing here talks to AWS
      - name: Render
        run: |
          REG=000000000000.dkr.ecr.ap-south-1.amazonaws.com
          DB=ci-placeholder.rds.amazonaws.com

          helm template ci ./helm/platform                                             > /tmp/backend.yaml
          helm template ci ./helm/middleware --set imageRegistry=$REG --set db.host=$DB >> /tmp/backend.yaml
          helm template ci ./helm/ai-service --set imageRegistry=$REG --set db.host=$DB >> /tmp/backend.yaml

      - name: Validate against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          # ExternalSecret is a custom resource, so its schema is not built in
          args: -strict -ignore-missing-schemas -summary /tmp/backend.yaml
