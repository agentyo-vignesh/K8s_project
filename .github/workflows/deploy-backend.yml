# Build both backend images, push them to ECR, deploy them with Helm.
# Same shape as deploy-frontend.yml, with two images instead of one.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "middleware/**"
      - "backend/**"
      - "helm/middleware/**"
      - "helm/ai-service/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  CLUSTER: ai-interview
  NAMESPACE: ai-interview

permissions:
  contents: read
  id-token: write

jobs:
  # Both images build at the same time
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: middleware
            context: middleware
          - image: ai-service
            context: backend # the FastAPI service lives in backend/

    steps:
      - uses: actions/checkout@v7

      # secrets, not env: this is a repository secret set in Settings.
      # Your editor may warn that it cannot see it - that is expected.
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/ai-interview-platform/${{ matrix.image }}:${{ github.sha }}"
          docker build -t "$IMAGE" ./${{ matrix.context }}
          docker push "$IMAGE"

  # Waits until BOTH images are in ECR
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Read the account id rather than hardcode it, so the same workflow works
      # in any account.
      - name: Read account id
        id: aws
        run: echo "account=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      # The deploy role needs an EKS access entry, or this fails with
      # "You must be logged in to the server"
      - name: Get cluster credentials
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"

      # No database host and no password anywhere in this file. Each pod reads
      # them from Secrets Manager itself, using the IAM role passed below.
      #
      # middleware first: Flyway creates the tables ai-service reads
      - name: Deploy middleware
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          helm upgrade --install middleware ./helm/middleware \
            --namespace "$NAMESPACE" \
            --set imageRegistry="$REGISTRY" \
            --set imageTag="${{ github.sha }}" \
            --set aws.roleArn="arn:aws:iam::${{ steps.aws.outputs.account }}:role/ai-interview-middleware" \
            --wait --timeout 8m

      - name: Deploy ai-service
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          helm upgrade --install ai-service ./helm/ai-service \
            --namespace "$NAMESPACE" \
            --set imageRegistry="$REGISTRY" \
            --set imageTag="${{ github.sha }}" \
            --set aws.roleArn="arn:aws:iam::${{ steps.aws.outputs.account }}:role/ai-interview-ai-service" \
            --wait --timeout 5m

      - name: Show what is running
        run: kubectl get pods -n "$NAMESPACE"
