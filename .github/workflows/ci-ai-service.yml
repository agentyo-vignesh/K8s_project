# Tests the AI service. Does not deploy, does not touch AWS.
#
# The code lives in backend/ but the service is called ai-service everywhere
# else - image name, Helm chart, Kubernetes Service.
name: CI ai-service

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "helm/ai-service/**"
      - ".github/workflows/ci-ai-service.yml"
  pull_request:
    paths:
      - "backend/**"
      - "helm/ai-service/**"
      - ".github/workflows/ci-ai-service.yml"
  workflow_dispatch:

concurrency:
  group: ci-ai-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: FastAPI app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Type check
        working-directory: backend
        run: mypy app

      # Runs on in-memory SQLite, so no database service is needed
      - name: Test
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # lint renders with the values given here. The chart defaults leave
      # imageTag and roleArn empty on purpose.
      - name: Lint
        run: |
          helm lint ./helm/ai-service \
            --set imageRegistry=000000000000.dkr.ecr.ap-south-1.amazonaws.com \
            --set imageTag=ci \
            --set aws.roleArn=arn:aws:iam::000000000000:role/ci

      - name: Render
        run: |
          helm template ci ./helm/ai-service \
            --set imageRegistry=000000000000.dkr.ecr.ap-south-1.amazonaws.com \
            --set imageTag=ci \
            --set aws.roleArn=arn:aws:iam::000000000000:role/ci \
            > rendered.yaml

      - name: Validate against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -ignore-missing-schemas -summary rendered.yaml
