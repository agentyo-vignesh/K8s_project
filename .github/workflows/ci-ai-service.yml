# Tests the AI service. Does not deploy, does not touch AWS.
#
# The code lives in backend/ but the service is called ai-service everywhere
# else - image name, Helm chart, Kubernetes Service.
name: CI ai-service

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "helm/ai-service/**"
      - ".github/workflows/ci-ai-service.yml"
  pull_request:
    paths:
      - "backend/**"
      - "helm/ai-service/**"
      - ".github/workflows/ci-ai-service.yml"
  workflow_dispatch:

concurrency:
  group: ci-ai-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: FastAPI app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Type check
        working-directory: backend
        run: mypy app

      # Runs on in-memory SQLite, so no database service is needed
      - name: Test
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # lint renders with the values given here. Every one of them is `required`
      # in the chart, so the defaults leave them empty on purpose and lint would
      # otherwise fail on the malformed output rather than on anything real.
      - name: Lint
        run: |
          helm lint ./helm/ai-service \
            --set imageRegistry=000000000000.dkr.ecr.ap-south-1.amazonaws.com \
            --set imageTag=ci \
            --set aws.roleArn=arn:aws:iam::000000000000:role/ci \
            --set aws.databaseSecretId=ci/db \
            --set aws.applicationSecretId=ci/app

      - name: Render
        run: |
          helm template ci ./helm/ai-service \
            --set imageRegistry=000000000000.dkr.ecr.ap-south-1.amazonaws.com \
            --set imageTag=ci \
            --set aws.roleArn=arn:aws:iam::000000000000:role/ci \
            --set aws.databaseSecretId=ci/db \
            --set aws.applicationSecretId=ci/app \
            > rendered.yaml

      - name: Validate against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -ignore-missing-schemas -summary rendered.yaml

  secrets:
    name: GitLeaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still in the
          # history and still compromised, so a shallow clone would miss it.
          fetch-depth: 0

      # Here rather than in security.yml, because a leaked secret must stop the
      # deploy. security.yml runs on pull requests and nightly, neither of which
      # gates a push straight to main.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
