# =============================================================================
# Security scanning.
#
# What is left here is the slow, repository-wide half. The two scans that must
# gate a deploy moved out, because this workflow runs on pull requests and
# nightly - neither of which gates a push straight to main:
#
#   GitLeaks      -> each service's CI, as the "secrets" job
#   Trivy (image) -> each deploy, between docker build and docker push, so a
#                    vulnerable image never reaches ECR at all
#
# Runs on every pull request, nightly, and on pushes that change this file.
# The nightly run is the one that earns its keep: a dependency you shipped last
# week can become a known CVE tomorrow with nobody touching the repository.
#
# Findings are uploaded as SARIF so they appear in the GitHub Security tab with
# inline annotations rather than only in a log nobody reads.
# =============================================================================
name: Security

on:
  # paths belongs on push, NOT on pull_request. On pull_request it would mean
  # "only scan a PR that edits this file", so every PR touching middleware/,
  # backend/ or frontend/ would merge with no GitLeaks, no Trivy and no CodeQL.
  # Scanning pull requests is the point of this workflow.
  #
  # On push it means the opposite and is what we want: code pushes stay quiet
  # because the PR already scanned them, but a change to this file runs
  # immediately. Without that, a break here sits unnoticed until the next PR or
  # the nightly run - which is how aquasecurity/trivy-action@0.28.0, a version
  # that does not exist, reached main with all four Trivy jobs dead.
  push:
    branches: [main]
    paths:
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main, master, develop]
  schedule:
    # 02:30 UTC daily.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Filesystem scan: dependency CVEs, IaC misconfiguration, hardcoded secrets.
  # ---------------------------------------------------------------------------
  trivy-filesystem:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          # Report but do not block here; the image scan below is the gate. A
          # transitive HIGH in a build-only dependency should not stop a hotfix.
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # Static analysis of the application code itself.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build (Java)
        if: matrix.language == 'java-kotlin'
        working-directory: middleware
        run: mvn -B -ntp clean compile -DskipTests

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
