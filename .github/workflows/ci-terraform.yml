# Checks the infrastructure code. Its own file so a .tf change does not also
# compile Java and run the Python tests.
name: CI terraform

on:
  push:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yml"
  workflow_dispatch:

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      # -backend=false means no S3 backend and no AWS credentials are needed
      - name: Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
