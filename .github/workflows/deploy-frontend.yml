# Build the frontend image, push it to ECR, deploy it with Helm.
name: Deploy frontend

on:
  # Only after CI frontend passes. No paths filter is needed here - CI frontend
  # has one, so a change that misses it never starts CI and never reaches
  # this workflow either.
  workflow_run:
    workflows: ["CI frontend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

  # Every name below is built from these two, the same way terraform builds them
  # from var.project and var.environment. Deploying to another environment is a
  # one-word change here plus the matching AWS_DEPLOY_ROLE_ARN secret.
  PROJECT: ai-interview
  ENVIRONMENT: dev
  CLUSTER: ai-interview-dev
  NAMESPACE: ai-interview-dev

  # The commit CI actually tested. On a workflow_run event github.sha is the
  # tip of the default branch, NOT the commit that triggered the run - using
  # it would build one commit and tag it as another. Falls back to github.sha
  # for a manual dispatch, where workflow_run is empty.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  # Required for OIDC - GitHub sends AWS a signed token instead of an access key
  id-token: write

jobs:
  deploy:
    # workflow_run fires when CI finishes, pass OR fail. Without this a red
    # CI would still deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as SHA: the default checkout takes the branch tip,
          # which may already be a newer commit than the one CI passed.
          ref: ${{ env.SHA }}

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit sha, so every deploy is traceable to one commit
      - name: Build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t scan-target ./frontend

      # Scan before the image leaves the runner. A vulnerable image never
      # reaches ECR, so nothing can pull it by mistake later. Only fixable
      # CRITICALs fail: an unpatched CVE in a base image cannot be actioned here
      # and blocking on it would teach people to ignore the gate.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: scan-target
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT-$ENVIRONMENT-platform/frontend:$SHA"
          docker tag scan-target "$IMAGE"
          docker push "$IMAGE"

      # The deploy role needs an EKS access entry, or this fails with
      # "You must be logged in to the server"
      - name: Get cluster credentials
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"

      # --atomic = --wait plus an automatic rollback if the pods never become
      # ready. Without it a failed rollout leaves the broken release running and
      # only the workflow turns red.
      - name: Deploy
        id: deploy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --namespace "$NAMESPACE" \
            --set imageRegistry="$REGISTRY" \
            --set imageRepository="$PROJECT-$ENVIRONMENT-platform" \
            --set imageTag="$SHA" \
            --atomic --timeout 5m

      # --atomic only catches "the pods never became ready". A pod can be
      # ready and still be broken, so check something the probe does not.
      - name: Verify
        run: |
          # nginx serves the SPA shell, not just /healthz. A pod can pass its
          # readiness probe and still serve nothing useful.
          kubectl run verify-fe-$SHA --rm --attach --restart=Never -q             -n "$NAMESPACE" --image=curlimages/curl:latest --             -fsS --max-time 10 http://frontend/ -o /dev/null

      # Only when Deploy itself succeeded. If --atomic failed it has already
      # rolled back, and rolling back again would drop a second revision.
      - name: Roll back
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Verification failed after a successful rollout - rolling back"
          helm rollback frontend -n "$NAMESPACE" --wait --timeout 5m
          kubectl get pods -n "$NAMESPACE" -l app=frontend

      - name: Show what is running
        run: kubectl get pods -n "$NAMESPACE" -l app=frontend
