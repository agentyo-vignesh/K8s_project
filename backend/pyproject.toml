[project]
name = "ai-interview-ai-service"
version = "1.0.0"
description = "AI question generation and answer evaluation for the AI Interview Platform"
requires-python = ">=3.11"

[tool.ruff]
# 120 rather than the 88/100 defaults. This codebase documents *why* decisions were made, so
# docstrings and comments carry real prose; reflowing them at 100 breaks sentences mid-clause and
# makes the rationale harder to read than the extra 20 columns cost. E501 stays enabled (see
# lint.select) so a genuinely runaway line still fails the build.
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import ordering
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "ASYNC",
]
ignore = [
    # Prefer explicit `Depends(...)` defaults, which FastAPI requires.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and long parametrised literals.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
# Required, not optional. Without it mypy synthesises model constructors from the camelCase `alias`
# and rejects every snake_case keyword argument, even though `populate_by_name=True` accepts both at
# runtime. The plugin reads the model config and types __init__ the way the models actually behave.
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Puts the project root on sys.path so "import app" works from a clean
# checkout. Without it pytest only sees tests/ and fails with
# ModuleNotFoundError: No module named 'app'.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
