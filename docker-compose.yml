# =============================================================================
# AI Interview Platform - local development stack
#
#   ./scripts/dev-up.sh          (creates the env files, waits for readiness)
#   docker compose up --build    (if you prefer doing it by hand)
#
#   frontend    http://localhost:3000
#   middleware  http://localhost:8080/swagger-ui.html
#   ai-service  http://localhost:8000/docs
#   postgres    localhost:5432
#
# -----------------------------------------------------------------------------
# Configuration lives in one env file PER SERVICE, not in a shared root .env:
#
#   database/.env    middleware/.env    backend/.env    frontend/.env
#
# Each is created from the .env.example beside it. A service can only read its
# own file, so it is impossible to accidentally depend on a value that belongs
# to another component.
#
# The trade-off is that the database credentials and the internal API key appear
# in more than one file. `./scripts/check-env.sh` verifies they agree and fails
# loudly if they drift.
#
# Port mappings still use ${VAR:-default}. With no root .env present the default
# always applies, and a student with a port clash can override it for one run:
#
#   MIDDLEWARE_PORT=18080 docker compose up -d
# -----------------------------------------------------------------------------
# =============================================================================

name: ai-interview-platform

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: aip-postgres
    restart: unless-stopped
    env_file:
      - ./database/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - aip-net
    healthcheck:
      # $$ escapes to a literal $ so the container's shell expands it from the
      # env file, rather than compose interpolating it from the host.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Middleware. Runs Flyway migrations on startup and therefore owns the schema
  # for the whole database, so it must be healthy before the AI service starts.
  # ---------------------------------------------------------------------------
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    image: ai-interview-platform/middleware:local
    container_name: aip-middleware
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./middleware/.env
    ports:
      - "${MIDDLEWARE_PORT:-8080}:8080"
    volumes:
      - resume-storage:/var/lib/ai-interview/resumes
    networks:
      - aip-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s) so in-flight
    # requests drain before SIGKILL.
    stop_grace_period: 40s

  # ---------------------------------------------------------------------------
  # AI service. Maps the ai_* tables but never creates them.
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-interview-platform/ai-service:local
    container_name: aip-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      middleware:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - aip-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-interview-platform/frontend:local
    container_name: aip-frontend
    restart: unless-stopped
    depends_on:
      middleware:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - aip-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  aip-net:
    driver: bridge

volumes:
  postgres-data:
  resume-storage:
