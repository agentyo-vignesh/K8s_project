imageRegistry: ""
# No default. The deploy workflow passes the commit sha, so every running
# pod is traceable to one commit. A default like "v1" would silently pin
# whatever was tagged v1 months ago - for middleware that is the image
# built before the AWS sts module was added, which crashes at startup.
imageTag: ""
# The repository path under the registry. bootstrap.sh passes what Terraform
# built, which is shared across environments by default - so the image tested in
# dev is the one promoted to prod.
imageRepository: ai-interview-platform


replicas: 1

# Needs metrics-server, which is an EKS addon in 2.eks.tf. Without it the HPA
# reports <unknown>/70% forever and never says why.
#
# This service and not the middleware: the middleware's volume is ReadWriteOnce,
# so a second replica could never attach it.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 70

# The pod reads its own secrets from AWS. There is no Kubernetes Secret, and no
# password is passed to Helm.
#
# No default. An empty annotation means the webhook injects no token, and
# the pod dies at startup with "Unable to load credentials from any of the
# providers in the chain" - which reads like a code bug, not a missing flag.
# Get it from: terraform output -raw ai_service_role_arn
aws:
  roleArn: ""
  region: ap-south-1
  databaseSecretId: ai-interview/prod/database
  applicationSecretId: ai-interview/prod/application
