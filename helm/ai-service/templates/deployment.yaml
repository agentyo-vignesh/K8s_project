apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Omitted entirely when the HPA is on. Leave it in and whoever applied last
  # wins: helm sets replicas back to 1, the HPA scales it up again, and the next
  # deploy undoes that. Exactly the same conflict as desired_size in 2.eks.tf,
  # solved the same way - name one owner.
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        # Restart the pod when the ConfigMap changes. Without this the pod keeps
        # running with the old values after a helm upgrade.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # This is what gives the pod its AWS identity
      serviceAccountName: ai-service

      containers:
        - name: ai-service
          image: {{ .Values.imageRegistry }}/ai-interview-platform/ai-service:{{ required "imageTag is required - pass --set imageTag=<sha>" .Values.imageTag }}
          ports:
            - name: http
              containerPort: 8000

          # Every setting comes from here. Nothing secret is in it.
          envFrom:
            - configMapRef:
                name: ai-service-config

          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 20

          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    # A ServiceMonitor selects on the labels of the SERVICE, not of the pods.
    app: ai-service
spec:
  selector:
    app: ai-service
  ports:
    # Named, because a ServiceMonitor selects a Service port by name. Leave the
    # name off and Prometheus silently scrapes nothing.
    - name: http
      port: 8000
      targetPort: http
