# Plain settings. No host, no user, no password - all of that comes from
# Secrets Manager at startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
data:
  APP_ENV: prod

  # aws, not env: the app reads Secrets Manager itself using its IAM role.
  # Note the names differ from the middleware's - two codebases.
  SECRETS_PROVIDER: aws
  AWS_DATABASE_SECRET_ID: "{{ required "aws.databaseSecretId is required - pass --set aws.databaseSecretId=<project>/<env>/..." .Values.aws.databaseSecretId }}"
  AWS_APPLICATION_SECRET_ID: "{{ required "aws.applicationSecretId is required - pass --set aws.applicationSecretId=<project>/<env>/..." .Values.aws.applicationSecretId }}"
  AWS_REGION: "{{ .Values.aws.region }}"

  DB_SSLMODE: require

  # The middleware creates the tables, not this service
  CREATE_SCHEMA_ON_STARTUP: "false"

  AI_PROVIDER: mock
