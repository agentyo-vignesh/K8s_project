# Where the image lives
imageRegistry: ""
# No default. The deploy workflow passes the commit sha, so every running
# pod is traceable to one commit. A default like "v1" would silently pin
# whatever was tagged v1 months ago - for middleware that is the image
# built before the AWS sts module was added, which crashes at startup.
imageTag: ""
# The repository path under the registry. bootstrap.sh passes what Terraform
# built, which is shared across environments by default - so the image tested in
# dev is the one promoted to prod.
imageRepository: ai-interview-platform


replicas: 1

# Where the browser sends /api requests. Read at container start and written
# into window.__APP_CONFIG__, so one image works in every environment.
#
# Empty means same-origin, which works because the ALB Ingress in helm/platform
# routes /api to the middleware. Reach the app at the Ingress address:
#
#   kubectl get ingress ai-interview -n ai-interview
#
# Uninstall that Ingress and this breaks in a confusing way: nginx.conf has no
# /api location, so a same-origin call falls through to the SPA rewrite and
# returns index.html with HTTP 200. The app then fails parsing HTML as JSON,
# which reads like an application bug rather than missing routing. The Axios
# interceptor rejects an HTML body to make that distinction visible.
#
# To bypass the Ingress entirely, port-forward both services:
#
#   kubectl port-forward -n ai-interview svc/middleware 8080:8080
#   kubectl port-forward -n ai-interview svc/frontend   3000:80
#   helm upgrade frontend ./helm/frontend ... --set apiBaseUrl=http://localhost:8080
#
# localhost, not the Service name: the browser runs outside the cluster and
# cannot resolve http://middleware:8080.
apiBaseUrl: ""
