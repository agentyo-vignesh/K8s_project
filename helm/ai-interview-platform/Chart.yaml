apiVersion: v2
name: ai-interview-platform
description: |
  AI Interview Platform - React frontend, Spring Boot middleware, FastAPI AI service
  and an optional in-cluster PostgreSQL for non-production environments.
type: application

# version  - the chart's own version. Bump on any template change.
# appVersion - the application release this chart defaults to. Bump on an app release.
# They move independently on purpose: a values-only fix should not claim a new app version.
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - interview
  - ai
  - devops-training

home: https://github.com/your-org/ai-interview-platform
sources:
  - https://github.com/your-org/ai-interview-platform

maintainers:
  - name: Platform Engineering
    email: platform@aiinterview.local

annotations:
  category: Application
  licenses: Apache-2.0

# Kubernetes 1.23+ is required for the autoscaling/v2 HPA API and for the
# projected service-account token that IRSA depends on.
kubeVersion: ">=1.23.0-0"
