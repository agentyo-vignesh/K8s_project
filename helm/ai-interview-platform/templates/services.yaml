{{/*
ClusterIP Services for all three components.

Only the frontend and middleware are reachable from the Ingress. The AI service
has no Ingress path at all: it is called by the middleware over the cluster
network and authenticated with a shared internal key, so it is never exposed to
the internet.
*/}}
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aip.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
{{- end }}
{{- if .Values.middleware.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "middleware") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.middleware.service.type }}
  ports:
    - name: http
      port: {{ .Values.middleware.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aip.selectorLabels" (dict "root" . "component" "middleware") | nindent 4 }}
{{- end }}
{{- if .Values.aiService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "ai-service") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "ai-service") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.aiService.service.type }}
  ports:
    - name: http
      port: {{ .Values.aiService.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aip.selectorLabels" (dict "root" . "component" "ai-service") | nindent 4 }}
{{- end }}
