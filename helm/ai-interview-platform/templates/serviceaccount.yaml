{{/*
ServiceAccounts.

The `eks.amazonaws.com/role-arn` annotation is the entire IRSA mechanism from the
cluster's side: it makes the EKS pod identity webhook project a signed
web-identity token into the pod and set AWS_ROLE_ARN and
AWS_WEB_IDENTITY_TOKEN_FILE. The AWS SDK's default credential provider chain
then exchanges that token for temporary credentials.

The application needs no code change and holds no access key. Both services
already build their AWS clients with the default chain, which is why switching
`aws.irsa.enabled` on is a values change and nothing more.

automountServiceAccountToken stays true: the projected IRSA token is delivered
through the same mechanism, so disabling it would break credential resolution.
*/}}
{{- if and .Values.middleware.enabled .Values.middleware.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aip.middlewareServiceAccountName" . }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "middleware") | nindent 4 }}
  annotations:
    {{- if and .Values.aws.irsa.enabled .Values.middleware.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.middleware.serviceAccount.roleArn | quote }}
    # Regional STS endpoint: lower latency than the global one and it keeps working
    # if the global endpoint has a partial outage.
    eks.amazonaws.com/sts-regional-endpoints: "true"
    {{- end }}
    {{- with .Values.middleware.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if and .Values.aiService.enabled .Values.aiService.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aip.aiServiceAccountName" . }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "ai-service") | nindent 4 }}
  annotations:
    {{- if and .Values.aws.irsa.enabled .Values.aiService.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.aiService.serviceAccount.roleArn | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    {{- end }}
    {{- with .Values.aiService.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
{{- end }}
