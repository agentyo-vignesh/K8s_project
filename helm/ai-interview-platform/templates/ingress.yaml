{{/*
Ingress.

Single host, path-routed. Order matters: the API paths are listed before the
catch-all `/`, because the AWS Load Balancer Controller evaluates rules in the
order given and a leading `/` would swallow everything.

Same-origin routing is the point. Because /api and the UI share a host, the
browser makes no cross-origin request, frontend.apiBaseUrl stays empty and no
CORS preflight is involved.

The AI service has no path here on purpose: it is internal-only.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aip.fullname" . }}
  labels:
    {{- include "aip.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.middleware.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
                port:
                  number: {{ .Values.middleware.service.port }}
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
                port:
                  number: {{ .Values.middleware.service.port }}
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
                port:
                  number: {{ .Values.middleware.service.port }}
          {{- end }}
          {{- if .Values.frontend.enabled }}
          # Catch-all last: React Router owns every remaining path.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aip.componentName" (dict "root" . "component" "frontend") }}
                port:
                  number: {{ .Values.frontend.service.port }}
          {{- end }}
{{- end }}
