{{/*
PodDisruptionBudgets.

These constrain *voluntary* disruption only: node drains, cluster upgrades,
Karpenter consolidation. They do nothing for a crash or a node failure.

minAvailable: 1 with replicaCount: 1 would block node drains entirely, so each
budget is rendered only when there is more than one replica (or autoscaling is on
with a minReplicas above one). Getting this wrong is a classic way to make a
cluster upgrade hang forever.
*/}}
{{- if and .Values.middleware.enabled .Values.middleware.podDisruptionBudget.enabled }}
{{- $mwReplicas := ternary (int .Values.middleware.autoscaling.minReplicas) (int .Values.middleware.replicaCount) .Values.middleware.autoscaling.enabled }}
{{- if gt $mwReplicas 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "middleware") | nindent 4 }}
spec:
  minAvailable: {{ .Values.middleware.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "aip.selectorLabels" (dict "root" . "component" "middleware") | nindent 6 }}
{{- end }}
{{- end }}
{{- if and .Values.aiService.enabled .Values.aiService.podDisruptionBudget.enabled }}
{{- $aiReplicas := ternary (int .Values.aiService.autoscaling.minReplicas) (int .Values.aiService.replicaCount) .Values.aiService.autoscaling.enabled }}
{{- if gt $aiReplicas 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "ai-service") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "ai-service") | nindent 4 }}
spec:
  minAvailable: {{ .Values.aiService.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "aip.selectorLabels" (dict "root" . "component" "ai-service") | nindent 6 }}
{{- end }}
{{- end }}
{{- if and .Values.frontend.enabled .Values.frontend.podDisruptionBudget.enabled }}
{{- $feReplicas := ternary (int .Values.frontend.autoscaling.minReplicas) (int .Values.frontend.replicaCount) .Values.frontend.autoscaling.enabled }}
{{- if gt $feReplicas 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  minAvailable: {{ .Values.frontend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "aip.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
{{- end }}
{{- end }}
