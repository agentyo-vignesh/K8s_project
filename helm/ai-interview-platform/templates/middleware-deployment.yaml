{{- if .Values.middleware.enabled }}
{{- $component := "middleware" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  {{- if not .Values.middleware.autoscaling.enabled }}
  replicas: {{ .Values.middleware.replicaCount }}
  {{- end }}
  {{- /*
    Local storage uses a ReadWriteOnce PVC, which only one node can mount for
    writing. Recreate avoids a rolling update deadlocking on a volume the old pod
    still holds. With S3 there is no volume, so a normal RollingUpdate applies.
  */}}
  {{- if and (eq .Values.middleware.storage.type "local") .Values.middleware.storage.local.persistence.enabled }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "aip.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aip.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        # Rolls pods when configuration changes. Without this a ConfigMap or Secret
        # edit updates the object but leaves every pod on the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aip.middlewareServiceAccountName" . }}
      {{- include "aip.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s) so in-flight
      # requests drain before SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: middleware
          image: {{ include "aip.image" (dict "root" . "image" .Values.middleware.image) }}
          imagePullPolicy: {{ .Values.middleware.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.middleware.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ printf "%s-middleware-config" (include "aip.fullname" .) }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.middleware.javaToolOptions | quote }}
            {{- if not .Values.aws.secretsManager.enabled }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aip.secretName" . }}
                  key: DB_PASSWORD
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aip.secretName" . }}
                  key: JWT_SIGNING_KEY
            - name: AI_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aip.secretName" . }}
                  key: AI_SERVICE_API_KEY
            {{- end }}
            {{- with .Values.middleware.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            Startup probe carries the slow path (JVM warm-up plus Flyway), so
            liveness can stay tight without risking a restart loop during a long
            migration. Liveness only starts once startup has succeeded.
          */}}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ .Values.middleware.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.middleware.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.middleware.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.middleware.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.middleware.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.middleware.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: {{ .Values.middleware.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.middleware.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.middleware.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.middleware.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so every writable path is an explicit
            # emptyDir. Tomcat needs a scratch directory and the JVM needs /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if and (eq .Values.middleware.storage.type "local") .Values.middleware.storage.local.persistence.enabled }}
            - name: resume-storage
              mountPath: {{ .Values.middleware.storage.local.path }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and (eq .Values.middleware.storage.type "local") .Values.middleware.storage.local.persistence.enabled }}
        - name: resume-storage
          persistentVolumeClaim:
            claimName: {{ printf "%s-resumes" (include "aip.fullname" .) }}
        {{- end }}
      {{- with .Values.middleware.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.middleware.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.middleware.affinity }}
      affinity:
        {{- toYaml .Values.middleware.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          # Preferred, not required: on a single-node dev cluster a hard rule would
          # leave the second replica permanently Pending.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "aip.selectorLabels" (dict "root" . "component" $component) | nindent 20 }}
      {{- end }}
{{- end }}
