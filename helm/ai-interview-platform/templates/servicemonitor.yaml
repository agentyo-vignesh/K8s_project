{{/*
Prometheus Operator integration.

Requires the ServiceMonitor and PrometheusRule CRDs. `.Capabilities.APIVersions.Has`
guards each object so the chart installs cleanly on a cluster without
kube-prometheus-stack rather than failing with "no matches for kind".

The `release` label on the ServiceMonitor usually has to match the Prometheus
instance's serviceMonitorSelector; set it via metrics.serviceMonitor.labels.
*/}}
{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- if .Values.middleware.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "middleware") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "aip.selectorLabels" (dict "root" . "component" "middleware") | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      scheme: http
{{- end }}
{{- if .Values.aiService.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "ai-service") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "ai-service") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "aip.selectorLabels" (dict "root" . "component" "ai-service") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      scheme: http
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.metrics.prometheusRule.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "aip.fullname" . }}
  labels:
    {{- include "aip.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ai-interview-platform
      rules:
        # Symptom-based, not cause-based: these fire on what a user would notice.
        - alert: MiddlewareHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job=~".*middleware.*",status=~"5.."}[5m]))
              /
            sum(rate(http_server_requests_seconds_count{job=~".*middleware.*"}[5m]))
              > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Middleware is returning 5xx for more than 5% of requests"
            description: "Sustained above 5% for 5 minutes. Check pod logs and database connectivity."

        - alert: MiddlewareHighLatency
          expr: |
            histogram_quantile(
              0.99,
              sum(rate(http_server_requests_seconds_bucket{job=~".*middleware.*"}[5m])) by (le)
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Middleware p99 latency above 2s"
            description: "Check the AI service, database pool saturation and GC pauses."

        - alert: AiServiceHighErrorRate
          expr: |
            sum(rate(http_requests_total{job=~".*ai-service.*",status="5xx"}[5m]))
              /
            sum(rate(http_requests_total{job=~".*ai-service.*"}[5m]))
              > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "AI service is returning 5xx for more than 5% of requests"

        - alert: AiGenerationFailing
          expr: |
            sum(rate(ai_questions_generated_total{outcome="failure"}[10m]))
              /
            clamp_min(sum(rate(ai_questions_generated_total[10m])), 0.001)
              > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "More than 25% of question generations are failing"
            description: "Check the model provider credentials, quota and upstream availability."

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ `{{ $labels.pod }}` }} is restarting repeatedly"
            description: "More than 3 restarts in 15 minutes. Check `kubectl logs --previous`."

        - alert: DeploymentReplicasUnavailable
          expr: |
            kube_deployment_status_replicas_unavailable{namespace="{{ .Release.Namespace }}"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ `{{ $labels.deployment }}` }} has unavailable replicas"
            description: "Pods are not becoming ready. Check readiness probes and resource pressure."
{{- end }}
{{- end }}
