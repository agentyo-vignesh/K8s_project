{{/*
Credentials Secret.

Rendered only when secrets.create=true, which is a development convenience: the
values end up in the release manifest stored in the cluster, so anyone with
`helm get manifest` can read them.

Production sets secrets.create=false and aws.secretsManager.enabled=true. The
pods then fetch credentials at runtime through IRSA and nothing sensitive is
rendered into a manifest, committed to Git, or visible to ArgoCD.
*/}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "aip.fullname" .) }}
  labels:
    {{- include "aip.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if not .Values.aws.secretsManager.enabled }}
  DB_PASSWORD: {{ required "secrets.data.dbPassword is required when AWS Secrets Manager is disabled" .Values.secrets.data.dbPassword | quote }}
  {{- end }}
  {{- /*
    The signing key and internal API key are needed even with Secrets Manager
    enabled only if you opt out of storing them there; when the AWS provider is
    on, the middleware and AI service read them from the application secret and
    these keys are unused. They are still rendered so a partial migration works.
  */}}
  JWT_SIGNING_KEY: {{ required "secrets.data.jwtSigningKey is required" .Values.secrets.data.jwtSigningKey | quote }}
  AI_SERVICE_API_KEY: {{ required "secrets.data.aiServiceApiKey is required" .Values.secrets.data.aiServiceApiKey | quote }}
  {{- if .Values.secrets.data.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.data.openaiApiKey | quote }}
  {{- end }}
{{- end }}
