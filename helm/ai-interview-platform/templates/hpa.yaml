{{/*
Horizontal Pod Autoscalers.

autoscaling/v2 so both CPU and memory targets can be expressed. Requires
metrics-server in the cluster; without it the HPA reports <unknown>/70% and never
scales, which is the single most common "my HPA does nothing" cause.

Scale-down is deliberately slower than scale-up: adding a pod early is cheap,
removing one during a lull only to need it again 30 seconds later causes
thrashing that users feel as latency.
*/}}
{{- if and .Values.middleware.enabled .Values.middleware.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
  labels:
    {{- include "aip.componentLabels" (dict "root" . "component" "middleware") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aip.componentName" (dict "root" . "component" "middleware") }}
  minReplicas: {{ .Values.middleware.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.middleware.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.middleware.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.middleware.autoscaling.targetMemoryUtilizationPercentage }}
    {{- /*
      A JVM heap does not shrink when load drops, so memory utilisation is a poor
      scale-*down* signal. It is kept as a scale-up safety net only; CPU is the
      metric that should normally drive this HPA.
    */}}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Five minutes of sustained low utilisation before removing a pod.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
{{- end }}
{{- if and .Values.aiService.enabled .Values.aiService.autoscaling.enabled }}
