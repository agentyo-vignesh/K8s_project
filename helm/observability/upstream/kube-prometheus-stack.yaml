# Values for prometheus-community/kube-prometheus-stack.
#
# Not our chart - this is what we pass to a third-party one. Everything here is
# either a size the chart does not set, or a default that is wrong for us.

# =============================================================================
# The single most important line in this file
# =============================================================================
prometheus:
  prometheusSpec:
    # Default is TRUE, which means "only pick up ServiceMonitors carrying this
    # release's label". Our ServiceMonitors are installed by a different chart,
    # so with the default Prometheus ignores them - and there is no error. The
    # targets page is simply empty and everything looks healthy.
    #
    # This is the number one reason "I installed Prometheus but see no metrics".
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Six hours. The cluster does not outlive a session, so a longer retention
    # only buys disk. Raise this and give Prometheus a volume if you ever want
    # to compare today against last week.
    retention: 6h

    # No PVC on purpose. A volume here means an EBS disk the CSI driver creates,
    # which then has to be cleaned up before `terraform destroy` - the same trap
    # the middleware's volume already teaches once. Losing 6h of metrics when a
    # pod restarts costs nothing on a cluster that lives for an afternoon.
    storageSpec: null

    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 900Mi

# =============================================================================
# Sizes. The chart ships NO resource requests for anything.
#
# That is worth showing a class: with no requests the scheduler treats these as
# free, packs them anywhere, and the first memory spike evicts something else.
# `kubectl describe node` afterwards shows the eviction with no obvious cause.
# =============================================================================
grafana:
  # The chart generates a random admin password into a Secret. Read it with:
  #   kubectl get secret -n observability kube-prometheus-stack-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  #
  # Deliberately not set here: a password in a values file is a password in git.
  # This is a Secret we accept, unlike the application's - it is Grafana's own
  # login, not customer data, and it never leaves the cluster.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # ClusterIP, reached by port-forward. NOT on the ALB Ingress: that would put a
  # Grafana with a generated password on the public internet.
  #   kubectl port-forward -n observability svc/kube-prometheus-stack-grafana 3000:80
  service:
    type: ClusterIP

  # Metrics and logs in one Grafana, which is the whole point of collecting both.
  # Prometheus is added by the chart; Loki is not, because it is a separate
  # release.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        # Turns a traceID field in a log line into a link. Our services emit
        # X-Request-Id rather than a trace id, so this is the hook to use later
        # if OpenTelemetry is ever added.
        maxLines: 1000

alertmanager:
  alertmanagerSpec:
    storage: null
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

# =============================================================================
# What a managed control plane does not let you scrape
#
# On EKS the API server is AWS's, and etcd, the scheduler and the controller
# manager are not reachable at all. The chart's default alert rules for them
# would fire permanently on a cluster that is perfectly healthy - which is how
# people learn to ignore alerts.
# =============================================================================
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
