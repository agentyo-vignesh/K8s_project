# =============================================================================
# nginx configuration for the production frontend image.
#
# Runs entirely as an unprivileged user: every path nginx writes to is under
# /tmp, and it listens on 3000 rather than 80 so no capability to bind a
# privileged port is required.
# =============================================================================

worker_processes auto;
# PID under /tmp because the default /var/run is not writable by a non-root user.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every temp path relocated under /tmp for the same reason as the PID file.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access log so the frontend's logs land in Loki with the same shape as the other services.
    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","service":"ai-interview-frontend",'
        '"component":"frontend","remoteAddr":"$remote_addr","method":"$request_method",'
        '"path":"$uri","httpStatus":$status,"bytes":$body_bytes_sent,'
        '"durationMs":$request_time,"referrer":"$http_referer",'
        '"userAgent":"$http_user_agent","requestId":"$http_x_request_id"}';

    access_log /dev/stdout json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    server {
        listen      3000;
        listen      [::]:3000;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # 10 MB matches the middleware's resume limit, so an oversized upload is rejected here with
        # a clear 413 rather than travelling the whole way to be refused.
        client_max_body_size 10m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Probe target for the container HEALTHCHECK and the Kubernetes probes. Deliberately not
        # index.html: it answers without touching the filesystem and is excluded from access logs.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Never cached: this file is regenerated per environment at container start, so a cached copy
        # would point a prod browser at a dev API.
        location = /runtime-config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        # Hashed filenames, so they can be cached indefinitely and immutably.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # index.html must never be cached: a stale copy would keep loading asset hashes that no
        # longer exist after a deploy.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        # SPA fallback: unknown paths are client-side routes, so serve the shell and let React Router
        # resolve them.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
