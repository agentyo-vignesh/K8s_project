# =============================================================================
# SonarQube project configuration.
#
# One project covering all three services, so the quality gate reflects the
# platform rather than letting a regression in one component hide behind
# healthy numbers in another.
# =============================================================================

sonar.projectKey=ai-interview-platform
sonar.projectName=AI Interview Platform
sonar.projectVersion=1.0.0

# SonarQube Cloud requires this; a self-hosted server ignores it. It defaults to
# the GitHub login when you import the repository, but check it on the project's
# Information page - a wrong value fails with "project not found", which reads
# like the projectKey is wrong.
sonar.organization=agentyo-vignesh

# -----------------------------------------------------------------------------
# Sources
# -----------------------------------------------------------------------------
sonar.sources=middleware/src/main/java,backend/app,frontend/src
sonar.tests=middleware/src/test/java,backend/tests,frontend/src/test

sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Language settings
# -----------------------------------------------------------------------------
sonar.java.source=21
sonar.java.binaries=middleware/target/classes
sonar.java.test.binaries=middleware/target/test-classes
sonar.java.libraries=middleware/target/**/*.jar

sonar.python.version=3.11,3.12

# -----------------------------------------------------------------------------
# Coverage reports, produced by the sonarqube.yml workflow before the scan.
# -----------------------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=middleware/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.junit.reportPaths=middleware/target/surefire-reports

# -----------------------------------------------------------------------------
# Exclusions
#
# Only generated output, vendored dependencies, and declaration-only code are
# excluded. Application code is never excluded to make a gate pass.
# -----------------------------------------------------------------------------
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  frontend/public/**

# DTOs, entities and enums are largely accessor code. Counting them dilutes the
# coverage figure until it stops signalling anything about the logic that matters.
sonar.coverage.exclusions=\
  middleware/src/main/java/**/dto/**,\
  middleware/src/main/java/**/domain/entity/**,\
  middleware/src/main/java/**/config/**,\
  middleware/src/main/java/**/MiddlewareApplication.java,\
  backend/app/main.py,\
  backend/app/schemas/**,\
  frontend/src/main.jsx,\
  frontend/src/theme.js

# Test code is analysed for correctness but excluded from duplication: repeated
# arrange blocks across tests are clearer than a shared helper that hides the setup.
sonar.cpd.exclusions=\
  **/dto/**,\
  **/schemas/**,\
  middleware/src/test/java/**,\
  backend/tests/**,\
  frontend/src/test/**
